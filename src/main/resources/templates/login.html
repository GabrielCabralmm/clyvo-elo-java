<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrar — CLYVO Elo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="pagina-login">
    <div class="cartao-login">
        <h1>CLYVO Elo</h1>
        <p class="subtitulo">Painel da clínica</p>

        <div class="alerta-erro" th:if="${param.erro}">Email ou senha inválidos.</div>
        <div class="alerta-sucesso" th:if="${param.saiu}">Sessão encerrada.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-grupo">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-grupo">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="botao" style="width:100%;">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
