<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo funcionário — CLYVO Elo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <h1>Novo funcionário</h1>
    <p class="subtitulo">Cadastre um doutor ou administrador</p>

    <div class="cartao" style="max-width:480px;">
        <form th:action="@{/funcionarios/salvar}" th:object="${funcionario}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-grupo">
                <label>Nome</label>
                <input type="text" th:field="*{nome}">
                <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="form-grupo">
                <label>Email</label>
                <input type="email" th:field="*{email}">
                <div class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-grupo">
                <label>Perfil</label>
                <select th:field="*{perfil}">
                    <option value="DOUTOR">Doutor</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <div class="form-grupo">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <button type="submit" class="botao">Salvar</button>
            <a th:href="@{/funcionarios}" class="botao-secundario">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
