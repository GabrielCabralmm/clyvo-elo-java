<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pets — CLYVO Elo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <h1>Pets</h1>
    <p class="subtitulo">Cadastro de pacientes da clínica</p>

    <a th:href="@{/pets/novo}" class="botao" style="margin-bottom:20px; display:inline-block;">+ Novo pet</a>

    <div class="cartao" style="padding:0;">
        <table>
            <thead>
            <tr><th>Nome</th><th>Espécie</th><th>Raça</th><th>Peso</th><th>Tutor</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.nome}"></td>
                <td th:text="${pet.especie}"></td>
                <td th:text="${pet.raca}"></td>
                <td th:text="${pet.pesoKg} + ' kg'"></td>
                <td th:text="${pet.nomeTutor}"></td>
                <td>
                    <a th:href="@{/pets/{id}/editar(id=${pet.id})}" class="botao-secundario" style="padding:5px 12px; font-size:12px;">Editar</a>
                    <form th:action="@{/pets/{id}/excluir(id=${pet.id})}" method="post" style="display:inline;" onsubmit="return confirm('Excluir este pet?');">
                        <button type="submit" class="botao-perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="vazio" th:if="${#lists.isEmpty(pets)}">Nenhum pet cadastrado ainda.</p>
    </div>
</div>
</body>
</html>
