<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pet — CLYVO Elo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <h1 th:text="${pet.id != null} ? 'Editar pet' : 'Novo pet'"></h1>
    <p class="subtitulo">Preencha os dados do paciente</p>

    <div class="cartao" style="max-width:480px;">
        <form th:action="@{/pets/salvar}" th:object="${pet}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-grupo">
                <label>Nome</label>
                <input type="text" th:field="*{nome}">
                <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="form-grupo">
                <label>Espécie</label>
                <select th:field="*{especie}">
                    <option value="CACHORRO">Cachorro</option>
                    <option value="GATO">Gato</option>
                </select>
                <div class="erro-campo" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
            </div>

            <div class="form-grupo">
                <label>Raça</label>
                <input type="text" th:field="*{raca}">
            </div>

            <div class="form-grupo">
                <label>Peso (kg)</label>
                <input type="number" step="0.1" th:field="*{pesoKg}">
            </div>

            <div class="form-grupo">
                <label>Nome do tutor</label>
                <input type="text" th:field="*{nomeTutor}">
                <div class="erro-campo" th:if="${#fields.hasErrors('nomeTutor')}" th:errors="*{nomeTutor}"></div>
            </div>

            <button type="submit" class="botao">Salvar</button>
            <a th:href="@{/pets}" class="botao-secundario">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
