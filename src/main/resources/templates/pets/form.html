<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pet.id != null} ? 'Editar pet' : 'Novo pet')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('pets')}"></header>
<main class="pagina">
    <div class="migalha"><a th:href="@{/pets}">Pets</a> / <span th:text="${pet.id != null} ? ${pet.nome} : 'Novo pet'"></span></div>
    <div class="cabecalho-pagina">
        <div>
            <h1 th:text="${pet.id != null} ? 'Editar pet' : 'Novo pet'">Novo pet</h1>
            <p class="subtitulo">Dados do paciente e do tutor responsável</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="cartao cartao-form">
        <form th:action="@{/pets/salvar}" th:object="${pet}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="form-linha">
                <div class="form-grupo">
                    <label for="nome">Nome</label>
                    <input type="text" th:field="*{nome}" th:errorclass="campo-com-erro" maxlength="80">
                    <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div class="form-grupo">
                    <label for="especie">Espécie</label>
                    <select th:field="*{especie}" th:errorclass="campo-com-erro">
                        <option value="">Selecione</option>
                        <option th:each="e : ${especies}" th:value="${e}" th:text="${e.descricao}"></option>
                    </select>
                    <div class="erro-campo" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
                </div>
            </div>

            <div class="form-linha">
                <div class="form-grupo">
                    <label for="raca">Raça</label>
                    <input type="text" th:field="*{raca}" th:errorclass="campo-com-erro" maxlength="80">
                    <div class="erro-campo" th:if="${#fields.hasErrors('raca')}" th:errors="*{raca}"></div>
                </div>
                <div class="form-grupo">
                    <label for="pesoKg">Peso (kg)</label>
                    <input type="number" step="0.1" min="0.1" max="150" th:field="*{pesoKg}" th:errorclass="campo-com-erro">
                    <div class="erro-campo" th:if="${#fields.hasErrors('pesoKg')}" th:errors="*{pesoKg}"></div>
                </div>
                <div class="form-grupo">
                    <label for="dataNascimento">Nascimento</label>
                    <input type="date" th:field="*{dataNascimento}" th:errorclass="campo-com-erro">
                    <div class="erro-campo" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                </div>
            </div>

            <div class="form-grupo">
                <label for="tutor">Tutor</label>
                <select id="tutor" name="tutor.id" th:classappend="${#fields.hasErrors('tutor')} ? 'campo-com-erro'">
                    <option value="">Selecione o tutor</option>
                    <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nome} + ' · ' + ${t.email}"
                            th:selected="${pet.tutor != null and pet.tutor.id == t.id}"></option>
                </select>
                <div class="erro-campo" th:if="${#fields.hasErrors('tutor')}" th:errors="*{tutor}"></div>
                <div class="ajuda">O tutor não está na lista? <a th:href="@{/tutores/novo}">Cadastre o tutor primeiro</a>.</div>
            </div>

            <div class="botoes-form">
                <button type="submit" class="botao">Salvar</button>
                <a th:href="${pet.id != null} ? @{/pets/{id}(id=${pet.id})} : @{/pets}" class="botao-secundario">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
